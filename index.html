<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Time Back — Legal & Info</title>
<style>
  :root {
    --navy: #16263d;
    --blue: #185fa5;
    --muted: #6b7280;
    --line: #e6e3d8;
    --paper: #f6f3ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
      system-ui, sans-serif;
    background: var(--paper);
    color: var(--navy);
    line-height: 1.8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    max-width: 560px;
    width: 100%;
  }
  .brand {
    display: flex; align-items: center; gap: 12px; margin-bottom: 28px;
  }
  .brand-icon {
    width: 44px; height: 44px; border-radius: 11px; background: var(--blue);
    flex-shrink: 0; position: relative;
  }
  .brand-icon::before, .brand-icon::after {
    content: ""; position: absolute; left: 10px; width: 24px; height: 5px;
    background: #fff; border-radius: 2.5px;
  }
  .brand-icon::before { top: 8px; }
  .brand-icon::after { bottom: 8px; }
  h1 { font-size: 22px; font-weight: 700; }
  .tagline { font-size: 14px; color: var(--muted); margin-top: 2px; }
  p.intro { font-size: 15px; color: var(--muted); margin-bottom: 24px; }
  .links {
    display: flex; flex-direction: column; gap: 10px;
  }
  .link-item {
    display: block;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--navy);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .link-item:hover {
    border-color: var(--blue);
    transform: translateY(-1px);
  }
  .link-title { font-size: 15px; font-weight: 700; }
  .link-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  footer {
    margin-top: 32px; font-size: 12px; color: var(--muted); text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon"></div>
    <div>
      <h1>Time Back</h1>
      <div class="tagline">時間を取り戻すための Web ツール</div>
    </div>
  </div>

  <p class="intro">
    Time Back プロジェクトの各種ドキュメントを掲載しています。
  </p>

  <div class="links">
    <a class="link-item" href="./privacy-policy.html">
      <div class="link-title">Shorts Limiter — プライバシーポリシー</div>
      <div class="link-desc">Privacy Policy for the Shorts Limiter extension</div>
    </a>
  </div>

  <footer>© 2026 Time Back</footer>
</div>
</body>
</html>
